<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
   * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, rgb(132, 21, 163), rgb(9, 173, 146));
    }

.calculator {
    width: 380px;
    padding: 20px;
    background: rgb(253, 212, 226);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgb(74, 50, 50);
}

h2 {
    text-align: center;
    color: rgb(25, 1, 1);
    margin-bottom: 15px;
}

#display {
    width: 100%;
    height: 70px;
    margin-bottom: 15px;
    padding: 10px;
    font-size: 25px;
    text-align: right;
    border: none;
    border-radius: 10px;
    background: white;
    color: rgb(8, 1, 1);
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px; 
}

button {
    height: 55px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    background: rgb(167, 181, 181);
    box-shadow: 0 5px 16px rgb(41, 41, 56);

}

button:hover {
    background: rgb(243, 241, 241);
}

.special {
    background: rgb(232, 108, 139);
    color: rgb(24, 7, 7);
}

.equal {
    background: rgb(78, 208, 78);
    color: white;
   
}

button:nth-child(4n) {
    background: rgba(47, 152, 249, 0.904);
    color: white;font-size: 35px;
}
button:nth-child(4n):hover{background-color: rgb(209, 219, 246);}
</style>
</head><body>

<div class="calculator">
    <h2>Scientific Calculator</h2>

    <input type="text" id="display" readonly>

    <div class="buttons">

        <button onclick="clearDisplay()" class="special">AC</button>
        <button onclick="deleteLast()" class="special">⌫</button>
        <button onclick="appendValue('(')">(</button>
        <button onclick="appendValue(')')">)</button>

        <button onclick="appendValue('sin(')">sin</button>
        <button onclick="appendValue('cos(')">cos</button>
        <button onclick="appendValue('tan(')">tan</button>
        <button onclick="appendValue('/')">÷</button>

        <button onclick="appendValue('log(')">log</button>
        <button onclick="appendValue('ln(')">ln</button>
        <button onclick="appendValue('sqrt(')">√</button>
        <button onclick="appendValue('*')">×</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('-')">−</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('+')">+</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button onclick="appendValue('Math.PI')">π</button>
        <button onclick="appendValue('**2')">x²</button>

    </div>
</div>
<script>
let display = document.getElementById("display");

function appendValue(value) {
    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function deleteLast() {
    display.value = display.value.slice(0, -1);
}

function calculate() {
    try {
        let expression = display.value;

        expression = expression
            .replace(/sin\(/g, "Math.sin(Math.PI/180*")
            .replace(/cos\(/g, "Math.cos(Math.PI/180*")
            .replace(/tan\(/g, "Math.tan(Math.PI/180*")
            .replace(/log\(/g, "Math.log10(")
            .replace(/ln\(/g, "Math.log(")
            .replace(/sqrt\(/g, "Math.sqrt(");

        display.value = eval(expression);
    }

    catch (error) {
        display.value = "Error";
    }
}
</script>

</body>
